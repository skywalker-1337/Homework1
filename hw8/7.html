<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удалить элемент</title>
</head>
<body>

    <!-- Несколько абзацев с разными классами -->
    <p class="description">Первоначальный текст 1.</p>
    <p>Абзац без класса description.</p>
    <p class="description">Первоначальный текст 2.</p>
    <p>Еще один абзац без класса.</p>
    <p class="description">Первоначальный текст 3.</p>

    <button id="removeElementButton">Удалить элемент</button>

    <script>

        const removeElementButton = document.querySelector('#removeElementButton');

        removeElementButton.addEventListener('click', () => {

            const firstDescription = document.querySelector('.description');

            if (firstDescription) {
                firstDescription.remove();
            }
        });
    </script>

</body>
</html>
