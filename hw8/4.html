<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменение текста по классу</title>
</head>
<body>

    <p class="description">Первоначальный текст 1.</p>
    <p class="description">Первоначальный текст 2.</p>
    <div class="description">Первоначальный текст 3.</div>
    <span class="description">Первоначальный текст 4.</span>

    <script>
        const elements = document.querySelectorAll('.description');

        elements.forEach(element => {
            element.textContent = 'Измененный текст';
        });
    </script>

</body>
</html>
